<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://api.fontshare.com; font-src 'self' https://api.fontshare.com https://cdn.fontshare.com; img-src 'self' data:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.gstatic.com; frame-src https://whoopsies-adcb1.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>guestbook admin · whoopsies</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#14080d">
    <link rel="icon" type="image/jpeg" href="/images/pfp.jpg?v=7">

    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap">
    <style>
        :root {
            --pink-1: #ffccd5; --pink-2: #ff9ab5; --pink-3: #ff6699;
            --muted: rgba(255, 236, 242, 0.7);
            --edge: rgba(255, 204, 213, 0.16);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            padding: 32px 18px 60px;
            font-family: "Satoshi", system-ui, -apple-system, "Segoe UI", sans-serif;
            color: #fff;
            background: #14080d url("/images/bg-poster.jpg?v=6") center / cover fixed;
            -webkit-font-smoothing: antialiased;
        }
        body::before { content: ""; position: fixed; inset: 0; background: rgba(12, 5, 10, 0.78); z-index: -1; }
        main { max-width: 640px; margin: 0 auto; }
        header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
        h1 { font-size: 24px; font-weight: 800; }
        h1 span { color: var(--pink-3); }
        h2 { font-size: 15px; font-weight: 700; margin: 26px 0 10px; color: var(--pink-2); letter-spacing: .5px; }
        h2 .n { color: var(--muted); font-weight: 600; }
        .who { font-size: 13px; color: var(--muted); }
        button {
            font: 700 13px/1 inherit;
            font-family: inherit;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid var(--edge);
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
            cursor: pointer;
        }
        button:hover { background: rgba(255, 154, 181, 0.18); }
        button:disabled { opacity: .5; cursor: progress; }
        .primary { color: #1d0c14; background: linear-gradient(135deg, var(--pink-1), var(--pink-3)); border: 0; }
        .primary:hover { filter: brightness(1.08); background: linear-gradient(135deg, var(--pink-1), var(--pink-3)); }
        .danger:hover { background: rgba(242, 63, 67, 0.25); border-color: rgba(242, 63, 67, 0.5); }
        .card {
            padding: 22px;
            background: rgba(24, 10, 18, 0.8);
            border: 1px solid var(--edge);
            border-radius: 18px;
        }
        .center { text-align: center; }
        .center p { margin: 8px 0 16px; color: var(--muted); }
        ul { list-style: none; display: grid; gap: 10px; }
        li {
            padding: 12px 14px;
            background: rgba(24, 10, 18, 0.8);
            border: 1px solid var(--edge);
            border-radius: 14px;
        }
        .meta { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); }
        .name { font-weight: 700; font-size: 14px; color: var(--pink-1); overflow-wrap: anywhere; }
        .msg { margin: 6px 0 10px; font-size: 14.5px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
        .actions { display: flex; gap: 8px; }
        .empty { padding: 14px; text-align: center; font-size: 13px; color: var(--muted); background: transparent; border: 1px dashed var(--edge); }
        .err { color: #ffb0b0; }
        .login { display: grid; gap: 10px; max-width: 300px; margin: 0 auto; }
        .login input {
            padding: 11px 13px;
            font: 500 14px/1.3 inherit;
            font-family: inherit;
            color: #fff;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--edge);
            border-radius: 12px;
            outline: none;
        }
        .login input:focus { border-color: var(--pink-2); }
        .login button { padding: 11px; }
        .login .err { margin: 0; font-size: 13px; }
        a { color: var(--pink-2); }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>guestbook admin <span>&#9825;</span></h1>
            <div id="userBox"></div>
        </header>
        <div id="app"><div class="card center"><p>loading&hellip;</p></div></div>
    </main>

    <script src="/js/guestbook-config.js?v=9"></script>
    <script type="module" src="/js/admin.js?v=10"></script>
</body>
</html>
