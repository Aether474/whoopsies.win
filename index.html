<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>@person</title>
    <meta name="description" content="envy is just envy,">
    <meta name="author" content="@person">
    <meta name="theme-color" content="#14080d">

    <meta property="og:title" content="@person">
    <meta property="og:description" content="envy is just envy,">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://whoopsies.win/">
    <meta property="og:site_name" content="whoopsies.win">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="@person">
    <meta name="twitter:description" content="envy is just envy,">

    <link rel="icon" type="image/jpeg" href="images/pfp.jpg?v=7">
    <link rel="apple-touch-icon" href="images/pfp.jpg?v=7">

    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap">
    <link rel="stylesheet" href="css/style.css?v=7">
</head>
<body class="is-locked">

    <!-- Background video -->
    <div class="bg" aria-hidden="true">
        <video id="bgVideo" autoplay muted loop playsinline preload="auto" poster="images/bg-poster.jpg?v=6">
            <source src="images/bg.mp4?v=6" type="video/mp4">
        </video>
        <div class="bg__shade"></div>
    </div>
    <canvas class="weather" id="weather" aria-hidden="true"></canvas>

    <!-- Click-to-enter intro -->
    <div class="intro is-loading" id="intro" role="button" tabindex="0" aria-label="Enter site">
        <div class="intro__inner">
            <div class="intro__title">whoopsies<span class="intro__heart">&#9825;</span></div>
            <div class="intro__load" aria-hidden="true">
                <div class="intro__paws"><span></span><span></span><span></span></div>
                <div class="intro__bar"><div class="intro__fill" id="loadFill"></div></div>
                <div class="intro__loadtxt" id="loadTxt">loading the room&hellip;</div>
            </div>
            <div class="intro__hint"><span class="hint-desktop">click</span><span class="hint-touch">tap</span> anywhere to enter</div>
        </div>
    </div>

    <!-- Profile -->
    <main class="stage">
        <article class="card" id="card">
            <div class="card__avatar-wrap">
                <button class="card__avatar" id="avatar" type="button" aria-label="profile picture" title="boop?">
                    <img src="images/pfp.jpg?v=7" alt="" width="500" height="500">
                </button>
                <span class="status" id="status" hidden></span>
            </div>

            <h1 class="card__name"><span class="card__name-text">person</span></h1>

            <ul class="badges" aria-label="badges">
                <li class="badge" tabindex="0" data-tip="whoopsies certified">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M12 20.3s-7.8-4.6-7.8-10.2A4.4 4.4 0 0 1 12 7.4a4.4 4.4 0 0 1 7.8 2.7c0 5.6-7.8 10.2-7.8 10.2Z"/></svg>
                    <span class="sr-only">whoopsies certified</span>
                </li>
                <li class="badge" tabindex="0" data-tip="sleepy" id="moonBadge">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M20 14.6A8 8 0 0 1 9.4 4a8 8 0 1 0 10.6 10.6Z"/></svg>
                    <span class="sr-only">sleepy</span>
                </li>
                <li class="badge" tabindex="0" data-tip="sparkly">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M12 2.5c.6 4.6 2.9 6.9 7.5 7.5-4.6.6-6.9 2.9-7.5 7.5-.6-4.6-2.9-6.9-7.5-7.5 4.6-.6 6.9-2.9 7.5-7.5Zm6.5 12.5c.3 2 1.2 3 3 3.3-1.8.3-2.7 1.2-3 3.2-.3-2-1.2-2.9-3-3.2 1.8-.3 2.7-1.3 3-3.3Z"/></svg>
                    <span class="sr-only">sparkly</span>
                </li>
            </ul>

            <div class="activity" id="activity" hidden>
                <img class="activity__art" id="activityArt" alt="" hidden>
                <div class="activity__text">
                    <div class="activity__kind" id="activityKind"></div>
                    <div class="activity__name" id="activityName"></div>
                </div>
            </div>

            <p class="card__bio" aria-live="polite"><span class="typed" id="typed"></span><span class="caret" aria-hidden="true"></span></p>

            <button class="gb-open" id="gbOpen" type="button" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4Z"/><path d="M13.5 6.5l4 4"/></svg>
                sign the guestbook
            </button>

            <footer class="card__footer">
                <span class="card__views" title="views">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <span id="views">&hellip;</span>
                </span>
                <span class="card__hint" id="hint" title="secrets found">
                    <span class="card__hint-text" id="hintText">psst&hellip; there are secrets here</span>
                    <span class="card__secrets" id="secretCount">0/4</span>
                </span>
            </footer>
        </article>
    </main>

    <!-- Weather switch -->
    <button class="weather-btn" id="weatherBtn" type="button" aria-label="Change weather">
        <span class="weather-btn__icon" aria-hidden="true"></span>
        <span class="weather-btn__label"></span>
    </button>

    <!-- Music player -->
    <div class="player" id="player">
        <button class="player__btn" id="playBtn" type="button" aria-label="Pause music">
            <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M8 5.2v13.6a.8.8 0 0 0 1.2.7l10.6-6.8a.8.8 0 0 0 0-1.4L9.2 4.5A.8.8 0 0 0 8 5.2Z"/></svg>
        </button>
        <div class="player__info">
            <div class="player__title"><span class="player__note">&#9834;</span> sakura zxc</div>
            <div class="player__bar" id="seek" role="slider" tabindex="0" aria-label="Song position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="player__fill" id="seekFill"></div>
            </div>
            <div class="player__time"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
        </div>
        <div class="player__vol">
            <button class="player__btn player__btn--small" id="muteBtn" type="button" aria-label="Mute">
                <svg class="i-vol" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M4 9.2h3.2L12 5.4v13.2l-4.8-3.8H4z"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18.2 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>
                <svg class="i-mute" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M4 9.2h3.2L12 5.4v13.2l-4.8-3.8H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
            </button>
            <input class="player__range" id="vol" type="range" min="0" max="1" step="0.01" value="0.45" aria-label="Volume">
        </div>
    </div>

    <!-- Guestbook -->
    <div class="gb" id="gb" hidden>
        <section class="gb__panel" role="dialog" aria-modal="true" aria-labelledby="gbTitle">
            <header class="gb__head">
                <h2 id="gbTitle">guestbook <span aria-hidden="true">&#9825;</span></h2>
                <button class="gb__close" id="gbClose" type="button" aria-label="Close guestbook">&times;</button>
            </header>

            <form class="gb__form" id="gbForm" autocomplete="off" novalidate>
                <input class="gb__input" id="gbName" name="name" type="text" maxlength="24" placeholder="your name" aria-label="Your name" required>
                <textarea class="gb__input gb__textarea" id="gbMsg" name="message" maxlength="280" rows="3" placeholder="leave a little message&hellip;" aria-label="Message" required></textarea>
                <input class="gb__trap" id="gbWebsite" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
                <div class="gb__row">
                    <span class="gb__count" id="gbCount">0/280</span>
                    <button class="gb__send" id="gbSend" type="submit">send &#9825;</button>
                </div>
                <p class="gb__status" id="gbStatus" role="status" aria-live="polite"></p>
                <p class="gb__note">messages show up after they&rsquo;re approved</p>
            </form>

            <ul class="gb__list" id="gbList"></ul>
        </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="fx" id="fx" aria-hidden="true"></div>

    <audio id="audio" src="media/sakura.mp3?v=6" loop preload="auto"></audio>

    <script src="js/weather.js?v=6" defer></script>
    <script src="js/trail.js?v=6" defer></script>
    <script src="js/main.js?v=6" defer></script>
    <script src="js/guestbook-config.js?v=6"></script>
    <script type="module" src="js/guestbook.js?v=6"></script>
</body>
</html>
