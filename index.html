<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>@.envy</title>
    <meta name="description" content="envy is just envy,">
    <meta name="author" content="@.envy">
    <meta name="theme-color" content="#14080d">

    <meta property="og:title" content="@.envy">
    <meta property="og:description" content="envy is just envy,">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://whoopsies.win/">
    <meta property="og:site_name" content="whoopsies.win">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="@.envy">
    <meta name="twitter:description" content="envy is just envy,">

    <link rel="icon" type="image/jpeg" href="images/pfp.jpg">
    <link rel="apple-touch-icon" href="images/pfp.jpg">

    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-locked">

    <!-- Background video -->
    <div class="bg" aria-hidden="true">
        <video id="bgVideo" autoplay muted loop playsinline preload="auto" poster="images/bg-poster.jpg">
            <source src="images/bg.mp4" type="video/mp4">
        </video>
        <div class="bg__shade"></div>
    </div>

    <!-- Click-to-enter intro -->
    <div class="intro" id="intro" role="button" tabindex="0" aria-label="Enter site">
        <div class="intro__inner">
            <div class="intro__title">whoopsies<span class="intro__heart">&#9825;</span></div>
            <div class="intro__hint"><span class="hint-desktop">click</span><span class="hint-touch">tap</span> anywhere to enter</div>
        </div>
    </div>

    <!-- Profile -->
    <main class="stage">
        <article class="card" id="card">
            <div class="card__avatar">
                <img src="images/pfp.jpg" alt="profile picture" width="236" height="236">
            </div>

            <h1 class="card__name"><span class="card__name-text">.envy</span></h1>
            <p class="card__bio">envy is just envy,</p>

            <footer class="card__footer">
                <span class="card__views">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                    who needs that????
                </span>
            </footer>
        </article>
    </main>

    <!-- Music toggle -->
    <button class="music" id="musicBtn" type="button" aria-label="Mute music" aria-pressed="false">
        <svg class="music__on" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M4 9.2h3.2L12 5.4v13.2l-4.8-3.8H4z"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18.2 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>
        <svg class="music__off" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M4 9.2h3.2L12 5.4v13.2l-4.8-3.8H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
        <span class="music__label">okay</span>
    </button>

    <audio id="audio" src="media/okay.mp3" loop preload="auto"></audio>

    <script src="js/cursor-effects.min.js" defer></script>
    <script src="js/main.js" defer></script>
</body>
</html>
